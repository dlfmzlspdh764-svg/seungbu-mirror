<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>결제 테스트</title>
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script></head>
<body style="font-family:sans-serif;padding:20px"><h3>카카오페이 결제 테스트 (숨김 페이지)</h3>
<button id="b">프리미엄 30일 결제</button><pre id="o"></pre>
<script>
const o=document.getElementById('o');
document.getElementById('b').onclick=async()=>{
  const r=await fetch('/api/pay/prepare',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"product":"premium_30d"}'});
  if(!r.ok){o.textContent='준비 실패: '+r.status+' '+await r.text();return;}
  const p=await r.json();
  const res=await PortOne.requestPayment(p);
  if(res.code){o.textContent='결제 취소/실패: '+res.message;return;}
  const v=await fetch('/api/pay/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.paymentId})});
  o.textContent=JSON.stringify(await v.json(),null,2);
};
</script></body></html>
