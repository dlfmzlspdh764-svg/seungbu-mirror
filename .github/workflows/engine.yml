# ☁️ 승부 예측 자동 분석 — runs while the box is paused. Generated by tools/mirror.py (box); edit it there.
# Code + model data come from the PRIVATE repo seungbu-engine (read-only deploy key ENGINE_KEY).
# No Telegram, no Web Push, no grading kept: record files are carried over from the last box publish.
# Self-sustaining: one ~5h35m loop job, re-dispatches itself at the end; cron (often never fires) is only a backup restarter.
# Lives on branch `ci` (default branch); mirror.py no longer copies it into `main`.
name: engine
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "publish even if the box copy is fresh"
        default: "0"
      loop_seconds:
        description: "loop length (test runs: e.g. 400)"
        default: "20100"
permissions:
  contents: write
  actions: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Seoul
      TG_BEST5: "0"
      TG_ALERTS: "0"
      TG_MORNING: "0"
      TG_CARD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/seungbu-engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          path: engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/requirements.lock
      - name: loop (publish whenever the box copy is stale)
        working-directory: engine
        env:
          FORCE: ${{ inputs.force }}
          LOOP_SECONDS: ${{ inputs.loop_seconds || '20100' }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/actions_run.sh
      - name: re-dispatch next loop (queues behind this run)
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run engine --repo "$GITHUB_REPOSITORY" --ref ci -f force=0
