# ☁️ 승부 예측 자동 분석 — runs while the box is paused. Generated by tools/mirror.py (box); edit it there.
# Code + model data come from the PRIVATE repo seungbu-engine (read-only deploy key ENGINE_KEY).
# No Telegram, no Web Push, no grading kept: record files are carried over from the last box publish.
name: engine
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "publish even if the box copy is fresh"
        default: "0"
permissions:
  contents: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      TG_BEST5: "0"
      TG_ALERTS: "0"
      TG_MORNING: "0"
      TG_CARD: "0"
    steps:
      - name: box copy fresh?
        id: fresh
        run: |
          idx=$(curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/snap/index.json?t=$(date +%s)" || echo '{}')
          python3 - "$idx" "${{ inputs.force }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, time
          i = json.loads(sys.argv[1] or "{}"); age = time.time() - i.get("generated_ms", 0) / 1000
          skip = sys.argv[2] != "1" and i.get("source", "box") == "box" and age < 600
          print(f"skip={'1' if skip else '0'}")
          print(f"skip: {skip} (last publish by {i.get('source','box')} {age/60:.1f} min ago)", file=sys.stderr)
          PY
      - uses: actions/checkout@v4
        if: steps.fresh.outputs.skip != '1'
        with:
          repository: ${{ github.repository_owner }}/seungbu-engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          path: engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != '1'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/requirements.lock
      - name: analyse + publish
        if: steps.fresh.outputs.skip != '1'
        working-directory: engine
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/actions_run.sh
